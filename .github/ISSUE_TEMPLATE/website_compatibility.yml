name: Website compatibility
description: A website doesn't work properly as a MyPack app.
labels: [website-compatibility]
body:
  - type: input
    id: url
    attributes:
      label: Website address
      placeholder: https://example.com
    validations:
      required: true
  - type: checkboxes
    id: symptoms
    attributes:
      label: What goes wrong?
      options:
        - label: Can't sign in, or sign-in pop-up doesn't work
        - label: Gets signed out after restarting or updating the app
        - label: Links open in the wrong place
        - label: Downloads, uploads, camera, microphone or notifications don't work
        - label: Page looks broken or is blank
        - label: Something else (describe below)
  - type: textarea
    id: details
    attributes:
      label: Details
      description: What you see, and what the same site does in a normal browser.
    validations:
      required: true
  - type: textarea
    id: settings
    attributes:
      label: App settings you changed
      description: For example window mode, custom CSS/JS, content blocking, proxy, user agent.
  - type: input
    id: version
    attributes:
      label: MyPack version and operating system
      placeholder: 1.0.0 on macOS 26.1
    validations:
      required: true
