name: Site

# Builds site/ on every pull request that touches it, and publishes it to Cloudflare Pages from main.
# Same setup as Triwarden's site. Needs two repository secrets: CLOUDFLARE_API_TOKEN (a token with
# Account › Cloudflare Pages › Edit) and CLOUDFLARE_ACCOUNT_ID. Optional repository variables:
# CLOUDFLARE_PAGES_PROJECT (default "mypack") and SITE_URL (default https://<project>.pages.dev; set it to the
# custom domain once one is attached, so canonical URLs, hreflang and the sitemap use it).
# Actions › Site › Run workflow on main redeploys by hand.

on:
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'mypack' }}

jobs:
  # Pull requests, main pushes and manual runs all build. Only main deploys.
  build:
    name: Build site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        env:
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.pages.dev', env.PROJECT) }}
        run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/dist
          retention-days: 3

  deploy:
    name: Deploy to Cloudflare Pages
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: site
      url: ${{ vars.SITE_URL || format('https://{0}.pages.dev', env.PROJECT) }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist
      - name: Check the Cloudflare secrets
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets (Settings › Secrets and variables › Actions)."
            exit 1
          fi
      # The first run creates the Pages project. Later runs fail this step because it exists, which is fine;
      # a real problem (a bad token, say) fails the deploy below too, with the error.
      - name: Create the Pages project if missing
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.156.0"
          command: pages project create ${{ env.PROJECT }} --production-branch main
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.156.0"
          command: pages deploy ./dist --project-name ${{ env.PROJECT }} --branch main
