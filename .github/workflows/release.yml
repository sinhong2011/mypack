# Publishes the Mypack app and CLI when a vX.Y.Z tag is pushed: the tag is
# the release. scripts/release.sh checks main and pushes it. The version
# comes from the tag alone (GoReleaser stamps it with -X), and the notes
# are the titles of the pull requests merged since the last tag. See
# docs/releasing.md.
name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".goreleaser.yaml"
      - ".github/workflows/release.yml"
      - "scripts/release.sh"
      - "scripts/packages.sh"
      - "scripts/linux-repo.sh"
      - "mygo.json"
      - "cmd/mypack/**"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release script examples
        run: bash scripts/release.sh --self-test
      - name: Package manifest examples
        run: bash scripts/packages.sh --self-test
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.20.1
          args: check

  # The tag's commit is tested again before anything is published: a tag
  # pushed by hand, or before CI on main finished, cannot ship a red build.
  verify:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CGO_ENABLED: "0"
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the tag
        run: |
          bash scripts/release.sh --check-tag "$GITHUB_REF_NAME"
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at a commit that is not on main"
            exit 1
          fi
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # the GitHub Release and its archives
    env:
      CGO_ENABLED: "0"
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # checkout can leave the tag lightweight; fetch it again so its
      # message (the release notes, .TagBody) is there.
      - name: Fetch the annotated tag
        run: git fetch --force --tags origin
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Publish the release
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.20.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Installers, built by mygo build (mygo.json) and uploaded to the Release
  # GoReleaser just published: a disk image for macOS (universal), setup
  # programs for Windows, and Debian and RPM packages for Linux. macOS
  # needs a macOS runner (signing, disk images); Ubuntu builds the rest.
  # On a pull request they are built and not uploaded.
  installers:
    needs: publish
    if: always() && (github.event_name == 'pull_request' || needs.publish.result == 'success')
    name: installers (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: write # upload to the Release
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest, platform: "darwin/universal" }
          - { name: Windows, os: ubuntu-latest, platform: "windows/amd64,windows/arm64" }
          - { name: Linux, os: ubuntu-latest, platform: "linux/amd64,linux/arm64" }
    env:
      CGO_ENABLED: "0"
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install NSIS, for the Windows installers
        if: matrix.name == 'Windows'
        run: sudo apt-get update && sudo apt-get install -y nsis
      # Developer ID signing and notarization (docs/releasing.md). The
      # certificate goes into a keychain that lasts as long as the job, and
      # mygo.json gets signingIdentity and notarize for this build only, so
      # local and pull request builds stay ad hoc.
      - name: Import the certificate and the notary credentials
        if: matrix.name == 'macOS' && github.event_name == 'push'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERTIFICATE" ]; then
            echo "::warning::MACOS_CERTIFICATE is not set; the disk image is signed ad hoc"
            exit 0
          fi
          for s in MACOS_CERTIFICATE_PASSWORD APPLE_ID APPLE_TEAM_ID APPLE_APP_PASSWORD; do
            if [ -z "${!s}" ]; then
              echo "::error::$s is not set; it is needed to sign and notarize the macOS app"
              exit 1
            fi
          done
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -base64 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain
          xcrun notarytool store-credentials notary --keychain "$keychain" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
          identity="$(security find-identity -v -p codesigning "$keychain" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')"
          if [ -z "$identity" ]; then
            echo "::error::MACOS_CERTIFICATE holds no Developer ID Application identity"
            exit 1
          fi
          echo "Signing as $identity"
          jq --arg id "$identity" --arg kc "$keychain" \
            '.macos.signingIdentity = $id | .macos.notarize = {keychainProfile: "notary", keychain: $kc}' \
            mygo.json > "$RUNNER_TEMP/mygo.json" && mv "$RUNNER_TEMP/mygo.json" mygo.json
      - name: Build
        run: make installers PLATFORM="${{ matrix.platform }}" VERSION="${{ github.event_name == 'push' && github.ref_name || 'v0.0.0-check' }}"
      - name: Upload to the Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(build/*/*.dmg build/*/*-setup-*.exe build/*/*.deb build/*/*.rpm)
          if (( ${#files[@]} == 0 )); then
            echo "::error::mygo build made no installers"
            exit 1
          fi
          printf '%s\n' "${files[@]}"
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber

  # Package managers, for stable releases (no "-" in the tag): the
  # manifests are written from the installers just uploaded, then each
  # job below publishes one, or skips with a notice when its secret is not
  # set. See docs/releasing.md, "Package managers".
  packages:
    needs: installers
    if: github.event_name == 'push' && needs.installers.result == 'success' && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download the installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" --dir release --pattern '*.dmg' --pattern '*-setup-*.exe' --pattern '*.deb' --pattern '*.rpm'
      - name: Write the manifests
        run: bash scripts/packages.sh render "$GITHUB_REF_NAME" release packages
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            packages
            release/*.deb
            release/*.rpm
          include-hidden-files: true

  # One classic token with public_repo (PACKAGING_TOKEN) writes the
  # Homebrew tap and the Scoop bucket and opens the winget pull request.
  homebrew:
    needs: packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TOKEN: ${{ secrets.PACKAGING_TOKEN }}
    steps:
      - if: env.TOKEN == ''
        run: echo "::notice::PACKAGING_TOKEN is not set; the Homebrew cask was not published"
      - if: env.TOKEN != ''
        uses: actions/checkout@v4
      - if: env.TOKEN != ''
        uses: actions/download-artifact@v4
        with:
          name: packages
      - name: Push the cask to sinhong2011/homebrew-tap
        if: env.TOKEN != ''
        run: bash scripts/packages.sh push sinhong2011/homebrew-tap packages/homebrew

  scoop:
    needs: packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TOKEN: ${{ secrets.PACKAGING_TOKEN }}
    steps:
      - if: env.TOKEN == ''
        run: echo "::notice::PACKAGING_TOKEN is not set; the Scoop manifest was not published"
      - if: env.TOKEN != ''
        uses: actions/checkout@v4
      - if: env.TOKEN != ''
        uses: actions/download-artifact@v4
        with:
          name: packages
      - name: Push the manifest to sinhong2011/scoop-bucket
        if: env.TOKEN != ''
        run: bash scripts/packages.sh push sinhong2011/scoop-bucket packages/scoop

  # Updates Mypack.Mypack in microsoft/winget-pkgs from a fork under the
  # token's account. The first version is submitted by hand.
  winget:
    needs: packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TOKEN: ${{ secrets.PACKAGING_TOKEN }}
    steps:
      - if: env.TOKEN == ''
        run: echo "::notice::PACKAGING_TOKEN is not set; winget was not updated"
      - if: env.TOKEN != ''
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: Mypack.Mypack
          installers-regex: '^mypack-setup-.*\.exe$'
          release-tag: ${{ github.ref_name }}
          token: ${{ secrets.PACKAGING_TOKEN }}

  chocolatey:
    needs: packages
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
    steps:
      - if: env.CHOCOLATEY_API_KEY == ''
        run: echo "::notice::CHOCOLATEY_API_KEY is not set; the Chocolatey package was not pushed"
      - if: env.CHOCOLATEY_API_KEY != ''
        uses: actions/download-artifact@v4
        with:
          name: packages
      - name: Pack and push
        if: env.CHOCOLATEY_API_KEY != ''
        shell: pwsh
        run: |
          choco pack packages/chocolatey/mypack.nuspec --outputdirectory .
          $version = "$env:GITHUB_REF_NAME".TrimStart('v')
          choco push "mypack.$version.nupkg" --source https://push.chocolatey.org/ --api-key "$env:CHOCOLATEY_API_KEY"

  aur:
    needs: packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
    steps:
      - if: env.AUR_SSH_PRIVATE_KEY == ''
        run: echo "::notice::AUR_SSH_PRIVATE_KEY is not set; mypack-bin was not updated"
      - if: env.AUR_SSH_PRIVATE_KEY != ''
        uses: actions/download-artifact@v4
        with:
          name: packages
      - name: Push mypack-bin to the AUR
        if: env.AUR_SSH_PRIVATE_KEY != ''
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" >~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan -t ed25519 aur.archlinux.org >>~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur -o IdentitiesOnly=yes"
          git clone ssh://aur@aur.archlinux.org/mypack-bin.git aur
          cp packages/aur/PKGBUILD packages/aur/.SRCINFO aur/
          cd aur
          git config user.name "Mypack release"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "Update to ${GITHUB_REF_NAME#v}"
          git push origin HEAD:master

  # The APT and RPM repositories on GitHub Pages (gh-pages branch), signed
  # with LINUX_REPO_GPG_KEY. The branch is one commit, rewritten each
  # release, so old packages do not pile up in its history.
  linux-repo:
    needs: packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # the gh-pages branch
    env:
      GPG_KEY: ${{ secrets.LINUX_REPO_GPG_KEY }}
    steps:
      - if: env.GPG_KEY == ''
        run: echo "::notice::LINUX_REPO_GPG_KEY is not set; the APT and RPM repositories were not updated"
      - if: env.GPG_KEY != ''
        uses: actions/checkout@v4
      - if: env.GPG_KEY != ''
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: artifact
      - name: Update the repositories
        if: env.GPG_KEY != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update && sudo apt-get install -y apt-utils createrepo-c
          printf '%s\n' "$GPG_KEY" | gpg --batch --import
          key=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ { print $10; exit }')
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if ! git clone --depth 1 --branch gh-pages "$remote" site; then
            mkdir site
          fi
          rm -rf site/.git
          KEEP=5 bash scripts/linux-repo.sh site artifact/release "$key"
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Mypack ${GITHUB_REF_NAME#v} packages"
          git push --force "$remote" gh-pages
