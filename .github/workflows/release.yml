# Publishes the Mypack app and CLI when a vX.Y.Z tag is pushed: the tag is
# the release. scripts/release.sh checks main and pushes it. The version
# comes from the tag alone (GoReleaser stamps it with -X), and the notes
# are the titles of the pull requests merged since the last tag. See
# docs/releasing.md.
name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".goreleaser.yaml"
      - ".github/workflows/release.yml"
      - "scripts/release.sh"
      - "mygo.json"
      - "cmd/mypack/**"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release script examples
        run: bash scripts/release.sh --self-test
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.20.1
          args: check

  # The tag's commit is tested again before anything is published: a tag
  # pushed by hand, or before CI on main finished, cannot ship a red build.
  verify:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CGO_ENABLED: "0"
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the tag
        run: |
          bash scripts/release.sh --check-tag "$GITHUB_REF_NAME"
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at a commit that is not on main"
            exit 1
          fi
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # the GitHub Release and its archives
    env:
      CGO_ENABLED: "0"
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # checkout can leave the tag lightweight; fetch it again so its
      # message (the release notes, .TagBody) is there.
      - name: Fetch the annotated tag
        run: git fetch --force --tags origin
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Publish the release
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.20.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Installers, built by mygo build (mygo.json) and uploaded to the Release
  # GoReleaser just published: a disk image for macOS (universal), setup
  # programs for Windows, and Debian and RPM packages for Linux. macOS
  # needs a macOS runner (signing, disk images); Ubuntu builds the rest.
  # On a pull request they are built and not uploaded.
  installers:
    needs: publish
    if: always() && (github.event_name == 'pull_request' || needs.publish.result == 'success')
    name: installers (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: write # upload to the Release
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest, platform: "darwin/universal" }
          - { name: Windows, os: ubuntu-latest, platform: "windows/amd64,windows/arm64" }
          - { name: Linux, os: ubuntu-latest, platform: "linux/amd64,linux/arm64" }
    env:
      CGO_ENABLED: "0"
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install NSIS, for the Windows installers
        if: matrix.name == 'Windows'
        run: sudo apt-get update && sudo apt-get install -y nsis
      # The key signs the update archives and manifests that installed
      # apps update from (mygo.json "updates"; docs/releasing.md). Without
      # it mygo build makes the installers alone.
      - name: Build
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: |
          if [[ -z "$MYGO_UPDATER_PRIVATE_KEY" && "${{ github.event_name }}" == push ]]; then
            echo "::warning::MYGO_UPDATER_PRIVATE_KEY is not set: this release has no self-updates"
          fi
          make installers PLATFORM="${{ matrix.platform }}" VERSION="${{ github.event_name == 'push' && github.ref_name || 'v0.0.0-check' }}"
      - name: Upload to the Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(build/*/*.dmg build/*/*-setup-*.exe build/*/*.deb build/*/*.rpm)
          # Self-updates: signed archives, deltas and update-<platform>.json
          # manifests, which apps read from the latest Release.
          updates=(build/*/mypack-*.tar.gz build/*/*.delta)
          manifests=(build/*/update-*.json)
          if (( ${#files[@]} == 0 )); then
            echo "::error::mygo build made no installers"
            exit 1
          fi
          printf '%s\n' "${files[@]}"
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          # Manifests last, so an app never reads one whose archive is missing.
          if (( ${#updates[@]} > 0 )); then
            printf '%s\n' "${updates[@]}"
            gh release upload "$GITHUB_REF_NAME" "${updates[@]}" --clobber
          fi
          if (( ${#manifests[@]} > 0 )); then
            printf '%s\n' "${manifests[@]}"
            gh release upload "$GITHUB_REF_NAME" "${manifests[@]}" --clobber
          fi
