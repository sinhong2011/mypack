# Publishes the Mypack app and CLI when a vX.Y.Z tag is pushed: the tag is
# the release. scripts/release.sh checks main and pushes it. The version
# comes from the tag alone (GoReleaser stamps it with -X), and the notes
# are the titles of the pull requests merged since the last tag. See
# docs/releasing.md.
name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".goreleaser.yaml"
      - ".github/workflows/release.yml"
      - "scripts/release.sh"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release script examples
        run: bash scripts/release.sh --self-test
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.20.1
          args: check

  # The tag's commit is tested again before anything is published: a tag
  # pushed by hand, or before CI on main finished, cannot ship a red build.
  verify:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CGO_ENABLED: "0"
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the tag
        run: |
          bash scripts/release.sh --check-tag "$GITHUB_REF_NAME"
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at a commit that is not on main"
            exit 1
          fi
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # the GitHub Release and its archives
    env:
      CGO_ENABLED: "0"
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # checkout can leave the tag lightweight; fetch it again so its
      # message (the release notes, .TagBody) is there.
      - name: Fetch the annotated tag
        run: git fetch --force --tags origin
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Publish the release
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.20.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
