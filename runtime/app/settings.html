<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Settings</title>
<style>
:root {
  color-scheme: light dark;
  --bg: Canvas;
  --fg: CanvasText;
  --muted: color-mix(in srgb, CanvasText 55%, Canvas);
  --line: color-mix(in srgb, CanvasText 12%, Canvas);
  --fill: color-mix(in srgb, CanvasText 6%, Canvas);
  --fill2: color-mix(in srgb, CanvasText 10%, Canvas);
  --accent: #0a64d8;
  --danger: #c0392b;
  --radius: 10px;
  font: 13px/1.4 -apple-system, system-ui, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --accent: #5b9dff; --danger: #ff6b6b; }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); }
#app { display: grid; grid-template-columns: 184px 1fr; height: 100%; }
nav {
  padding: 14px 10px; border-right: 1px solid var(--line);
  display: flex; flex-direction: column; gap: 2px; background: var(--fill);
}
nav button {
  appearance: none; border: 0; background: transparent; color: inherit;
  text-align: left; padding: 8px 10px; border-radius: 8px; font: inherit; cursor: pointer;
}
nav button:hover { background: var(--fill2); }
nav button.active { background: var(--accent); color: #fff; }
main { overflow: auto; padding: 22px 26px 40px; }
h1 { font-size: 20px; font-weight: 650; margin: 0 0 16px; letter-spacing: -.02em; }
h2 { font-size: 12px; font-weight: 650; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 22px 0 8px; }
.card {
  background: var(--fill); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden;
}
.row {
  display: grid; grid-template-columns: minmax(140px, 1fr) minmax(180px, 1.2fr);
  gap: 12px 16px; align-items: center; padding: 11px 14px;
  border-top: 1px solid var(--line);
}
.row:first-child { border-top: 0; }
.row.wide { grid-template-columns: 1fr; align-items: start; }
label.k { font-weight: 550; }
.desc { color: var(--muted); font-size: 12px; margin-top: 2px; }
input[type=text], input[type=number], input[type=url], select, textarea {
  font: inherit; color: inherit; background: var(--bg);
  border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; width: 100%;
}
textarea { min-height: 88px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
.ctrl { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.ctrl.grow { justify-content: stretch; }
.ctrl.grow > * { flex: 1; }
.dim { display: flex; gap: 6px; align-items: center; }
.dim input { width: 88px; }
button.btn {
  appearance: none; font: inherit; padding: 5px 12px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--bg); color: inherit; cursor: pointer;
}
button.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.btn.danger { color: var(--danger); }
.switch { position: relative; width: 40px; height: 22px; flex: 0 0 auto; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch span {
  position: absolute; inset: 0; background: var(--fill2); border-radius: 11px; transition: .15s;
}
.switch span:before {
  content: ""; position: absolute; height: 18px; width: 18px; left: 2px; top: 2px;
  background: #fff; border-radius: 50%; transition: .15s;
}
.switch input:checked + span { background: var(--accent); }
.switch input:checked + span:before { transform: translateX(18px); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 4px; background: var(--fill2);
  border-radius: 999px; padding: 3px 8px 3px 10px; font-size: 12px;
}
.chip button { appearance: none; border: 0; background: transparent; color: var(--muted); cursor: pointer; font: inherit; padding: 0 2px; }
.hint { margin: 0 0 14px; padding: 10px 12px; border-radius: 8px; background: color-mix(in srgb, var(--accent) 14%, var(--bg)); }
.err { margin: 0 0 14px; padding: 10px 12px; border-radius: 8px; background: color-mix(in srgb, var(--danger) 16%, var(--bg)); color: var(--danger); }
.note { color: var(--muted); font-size: 12px; }
.about dt { color: var(--muted); font-size: 12px; margin-top: 10px; }
.about dd { margin: 2px 0 0; word-break: break-all; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
.hidden { display: none !important; }
.add { display: flex; gap: 8px; margin-top: 8px; }
</style>
</head>
<body>
<div id="app">
<nav id="nav"></nav>
<main>
  <div id="banner" class="hint hidden"></div>
  <div id="error" class="err hidden"></div>
  <div id="pane"></div>
</main>
</div>
<script type="application/json" id="boot">{{BOOT}}</script>
<script>
const boot = JSON.parse(document.getElementById("boot").textContent);
const say = t => { document.title = ""; document.title = t; };
const $ = (id) => document.getElementById(id);
const panes = [
  ["general", "General"],
  ["window", "Window"],
  ["pages", "Pages"],
  ["downloads", "Downloads"],
  ["privacy", "Privacy"],
  ["native", "Native"],
  ["customize", "Customize"],
  ["about", "About"],
];
const S = {
  title: boot.title || "",
  window: Object.assign({
    width: 1200, height: 780, minWidth: 480, minHeight: 360, zoom: 100,
    alwaysOnTop: false, fullscreen: false, hideOnClose: false, multiWindow: false,
    darkMode: "system", titleBarStyle: "default", mode: "", tabs: false,
    sidebarEdge: "", sidebarAutoHide: false, panelWidth: 0, panelHeight: 0
  }, boot.window || {}),
  webview: Object.assign({
    userAgent: "", userAgentPreset: "safari", incognito: false, restoreLastUrl: false,
    findInPage: false, devTools: false, css: "", js: "", externalByDefault: true,
    navigation: { safeDomains: [], internalUrlRegex: "", popups: "internal" },
    blocking: { trackers: false, cookieBanners: false, allow: [], hide: [] }
  }, boot.webview || {})
};
S.webview.navigation = Object.assign({ safeDomains: [], internalUrlRegex: "", popups: "internal" }, (boot.webview || {}).navigation || {});
S.webview.blocking = Object.assign({ trackers: false, cookieBanners: false, allow: [], hide: [] }, (boot.webview || {}).blocking || {});
S.network = Object.assign({ downloadDirectory: "", proxy: "", basicAuthUser: "" }, boot.network || {});
S.native = Object.assign({
  tray: false, startToTray: false, globalShortcut: "", camera: false, microphone: false,
  dragDrop: false, notifications: "allow", badge: "auto", linkRouting: true
}, boot.native || {});

let pane = "general", saveT = 0;
const field = (id, inner) => `<div class="row" id="row-${id}">${inner}</div>`;
const lab = (title, desc) => `<div><div class="k">${title}</div>${desc ? `<div class="desc">${desc}</div>` : ""}</div>`;
const sel = (id, opts) => `<select id="${id}">${opts.map(([v,l]) => `<option value="${v}">${l}</option>`).join("")}</select>`;
const tog = (id) => `<label class="switch"><input type="checkbox" id="${id}"><span></span></label>`;
const num = (id) => `<input type="number" id="${id}">`;
const txt = (id, ph="") => `<input type="text" id="${id}" placeholder="${ph}">`;

function render() {
  const nav = $("nav");
  nav.innerHTML = panes.map(([id, label]) =>
    `<button type="button" data-pane="${id}" class="${id===pane?"active":""}">${label}</button>`).join("");
  nav.querySelectorAll("button").forEach(b => b.onclick = () => { pane = b.dataset.pane; render(); });
  if (boot.restartHint) { $("banner").textContent = boot.restartHint; $("banner").classList.remove("hidden"); }
  $("pane").innerHTML = views[pane]();
  bind();
  fill();
}

const views = {
  general() {
    return `<h1>General</h1><div class="card">
      ${field("title", lab("Window title", "Leave empty to use the app name.") + `<div class="ctrl grow">${txt("title", boot.name)}</div>`)}
      ${field("dark", lab("Appearance") + `<div class="ctrl">${sel("darkMode", [["system","System"],["light","Light"],["dark","Dark"]])}</div>`)}
      ${field("zoom", lab("Default zoom") + `<div class="ctrl">${sel("zoom", [["80","80%"],["90","90%"],["100","100%"],["110","110%"],["125","125%"],["150","150%"]])}</div>`)}
      ${field("aot", lab("Always on top") + tog("alwaysOnTop"))}
      ${field("hoc", lab("Hide on close", "The app stays running when you close the window.") + tog("hideOnClose"))}
      ${field("notif", lab("Notifications") + `<div class="ctrl">${sel("notifications", [["allow","Allow"],["ask","Ask first"],["deny","Off"]])}</div>`)}
      ${field("badge", lab("Unread badge", "Show a count on the Dock or taskbar icon.") + tog("badgeOn"))}
    </div>`;
  },
  window() {
    const mode = S.window.mode || "window";
    const panel = mode !== "window";
    const side = mode === "sidebar";
    return `<h1>Window</h1><div class="card">
      ${field("size", lab("Size") + `<div class="dim">${num("width")}<span>×</span>${num("height")}<span class="note">pt</span></div>`)}
      ${field("min", lab("Minimum size") + `<div class="dim">${num("minWidth")}<span>×</span>${num("minHeight")}<span class="note">pt</span></div>`)}
      ${field("mode", lab("Show as", "Compact, sidebar and menu bar can also be switched from the View menu.") + `<div class="ctrl">${sel("mode", [["window","Window"],["compact","Compact"],["sidebar","Sidebar"],["menubar","Menu bar"]])}</div>`)}
      ${panel ? field("panel", lab("Panel size") + `<div class="dim">${num("panelWidth")}<span>×</span>${num("panelHeight")}<span class="note">pt</span></div>`) : ""}
      ${side ? field("edge", lab("Sidebar edge") + `<div class="ctrl">${sel("sidebarEdge", [["right","Right"],["left","Left"]])}</div>`) : ""}
      ${side ? field("ah", lab("Hide sidebar when idle") + tog("sidebarAutoHide")) : ""}
      ${field("tb", lab("Title bar", boot.lite ? "Hidden, overlay and glass need the full runtime." : "A rebuild is needed after changing this.") + `<div class="ctrl">${sel("titleBarStyle", [["default","Standard"],["hidden","Hidden"],["overlay","Overlay"],["glass","Glass"]])}</div>`)}
      ${field("tabs", lab("Tabs", boot.lite ? "Tabs need a rebuild with the full runtime." : "Opens links in tabs instead of new windows. Restart to apply.") + tog("tabs"))}
      ${field("fs", lab("Start full screen") + tog("fullscreen"))}
      ${field("mw", lab("Allow extra windows") + tog("multiWindow"))}
    </div>`;
  },
  pages() {
    return `<h1>Pages</h1><div class="card">
      ${field("links", lab("Other links", "Addresses that are not this site.") + `<div class="ctrl">${sel("externalByDefault", [["1","Open in browser"],["0","Keep in app"]])}</div>`)}
      ${field("popups", lab("Pop-ups") + `<div class="ctrl">${sel("popups", [["internal","Open in app"],["external","Open in browser"],["block","Block"]])}</div>`)}
      ${field("ua", lab("Browser identity") + `<div class="ctrl">${sel("userAgentPreset", [["safari","Safari"],["chrome","Chrome"],["edge","Edge"],["firefox","Firefox"],["mobile-safari","Mobile Safari"],["custom","Custom"]])}</div>`)}
      ${S.webview.userAgentPreset === "custom" ? field("uac", lab("Custom user agent") + `<div class="ctrl grow">${txt("userAgent")}</div>`) : ""}
      ${field("restore", lab("Restore last page") + tog("restoreLastUrl"))}
      ${field("find", lab("Find in page", boot.lite ? "Needs the full runtime." : "") + tog("findInPage"))}
      ${field("dev", lab("Developer tools") + tog("devTools"))}
    </div>
    <h2>Stay in the app</h2>
    <div class="card">
      <div class="row wide">${lab("Safe domains", "These sites open inside the app. The site you built this app from is always included.")}
        <div id="domains"></div>
        <div class="add">${txt("domainAdd", "example.com")}<button class="btn" id="domainBtn" type="button">Add</button></div>
      </div>
      <div class="row wide">${lab("Internal URL pattern", "A regular expression. Matching addresses stay in the app.")}
        ${txt("internalUrlRegex", "^https://(www\\\\.)?example\\\\.com/")}
      </div>
    </div>`;
  },
  downloads() {
    return `<h1>Downloads</h1><div class="card">
      ${field("dl", lab("Save files to", "Empty uses the system Downloads folder.") + `
        <div>
          <div class="ctrl grow">${txt("downloadDirectory", "~/Downloads")}<button class="btn" id="chooseDl" type="button">Choose…</button></div>
          <div class="note" style="margin-top:6px">${boot.downloadDir ? "Currently " + boot.downloadDir : "No folder is available yet."}</div>
        </div>`)}
      ${field("proxy", lab("Proxy", "Web pages follow the system proxy. This value is kept for tools that read it.") + `<div class="ctrl grow">${txt("proxy", "http://127.0.0.1:7890")}</div>`)}
      ${field("auth", lab("Saved username", "Used when a site asks for a sign-in. The password is never stored.") + `<div class="ctrl grow">${txt("basicAuthUser")}</div>`)}
    </div>
    <p class="note" style="margin-top:14px"><button class="btn" id="showDl" type="button">Show downloads folder</button></p>`;
  },
  privacy() {
    return `<h1>Privacy</h1><div class="card">
      ${field("incog", lab("Stay signed out", "Uses a private session. Needs a restart.") + tog("incognito"))}
      ${field("tr", lab("Block trackers") + tog("trackers"))}
      ${field("cb", lab("Hide cookie banners") + tog("cookieBanners"))}
    </div>
    <h2>Exceptions</h2>
    <div class="card">
      <div class="row wide">${lab("Allow these sites", "Nothing is blocked on these domains.")}
        <div id="allow"></div>
        <div class="add">${txt("allowAdd", "example.com")}<button class="btn" id="allowBtn" type="button">Add</button></div>
      </div>
    </div>`;
  },
  native() {
    const mb = boot.menuBar;
    return `<h1>Native</h1><div class="card">
      ${mb ? "" : field("tray", lab("Menu bar / tray icon") + tog("tray"))}
      ${mb ? "" : field("stt", lab("Start hidden in the tray") + tog("startToTray"))}
      ${field("gs", lab("Global shortcut", "Bring the app forward from anywhere.") + `<div class="ctrl grow">${txt("globalShortcut", "CmdOrCtrl+Shift+Space")}</div>`)}
      ${field("lr", lab("Open links in other MyPack apps") + tog("linkRouting"))}
      ${field("dd", lab("Allow drag and drop") + tog("dragDrop"))}
      ${field("cam", lab("Camera", "macOS still needs this turned on when the app is built.") + tog("camera"))}
      ${field("mic", lab("Microphone", "macOS still needs this turned on when the app is built.") + tog("microphone"))}
    </div>`;
  },
  customize() {
    return `<h1>Customize</h1><div class="card">
      <div class="row wide">${lab("Custom CSS", "Injected into every page.")}<textarea id="css" placeholder="/* body { font-size: 15px } */"></textarea></div>
      <div class="row wide">${lab("Hide elements", "CSS selectors hidden on every page.")}
        <div id="hide"></div>
        <div class="add">${txt("hideAdd", ".promo-banner")}<button class="btn" id="hideBtn" type="button">Add</button></div>
      </div>
      <div class="row wide">${lab("Custom JavaScript", "Runs in every page. Only add scripts you trust.")}<textarea id="js" placeholder="// document.title = 'Hello'"></textarea></div>
    </div>`;
  },
  about() {
    return `<h1>About</h1>
      <div class="card" style="padding:14px 16px">
        <dl class="about">
          <dt>App</dt><dd>${esc(boot.name)} ${esc(boot.version)}</dd>
          <dt>Identifier</dt><dd>${esc(boot.identifier)}</dd>
          <dt>Profile</dt><dd>${esc(boot.profileDir)}</dd>
        </dl>
      </div>
      <p style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn" id="openProfile" type="button">Show profile folder</button>
        <button class="btn danger" id="reset" type="button">Restore built-in settings…</button>
      </p>
      <p class="note">Your changes are saved in this app’s profile. They survive rebuilds until you restore the built-in settings.</p>`;
  }
};

function esc(s){ return String(s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])); }

function chips(el, items, onRemove) {
  el.innerHTML = `<div class="chips">${items.map((d,i) =>
    `<span class="chip">${esc(d)}<button type="button" data-i="${i}" aria-label="Remove">×</button></span>`).join("")}</div>`;
  el.querySelectorAll("button").forEach(b => b.onclick = () => onRemove(+b.dataset.i));
}

function bind() {
  const on = (id, fn) => { const el = $(id); if (el) el.addEventListener(el.tagName==="BUTTON"||el.type==="checkbox"||el.tagName==="SELECT"?"change":"input", fn); };
  const click = (id, fn) => { const el = $(id); if (el) el.onclick = fn; };
  const touch = () => scheduleSave();
  ["title","darkMode","zoom","alwaysOnTop","hideOnClose","notifications","badgeOn",
   "width","height","minWidth","minHeight","mode","panelWidth","panelHeight","sidebarEdge",
   "sidebarAutoHide","titleBarStyle","tabs","fullscreen","multiWindow",
   "externalByDefault","popups","userAgentPreset","userAgent","restoreLastUrl","findInPage","devTools",
   "internalUrlRegex","downloadDirectory","proxy","basicAuthUser",
   "incognito","trackers","cookieBanners","tray","startToTray","globalShortcut","linkRouting",
   "dragDrop","camera","microphone","css","js"].forEach(id => on(id, () => {
     read();
     if (id==="mode"||id==="userAgentPreset") render();
     touch();
   }));
  click("chooseDl", () => say("mypack:settings:folder"));
  click("showDl", () => say("mypack:settings:downloads"));
  click("openProfile", () => say("mypack:settings:profile"));
  click("reset", () => { if (confirm("Restore the settings this app was built with?")) say("mypack:settings:reset"); });
  click("domainBtn", () => addChip("domainAdd", S.webview.navigation.safeDomains, render));
  click("allowBtn", () => addChip("allowAdd", S.webview.blocking.allow, render));
  click("hideBtn", () => addChip("hideAdd", S.webview.blocking.hide, render));
  const da = $("domainAdd"); if (da) da.addEventListener("keydown", e => { if (e.key==="Enter") { e.preventDefault(); addChip("domainAdd", S.webview.navigation.safeDomains, render); }});
  const aa = $("allowAdd"); if (aa) aa.addEventListener("keydown", e => { if (e.key==="Enter") { e.preventDefault(); addChip("allowAdd", S.webview.blocking.allow, render); }});
  const ha = $("hideAdd"); if (ha) ha.addEventListener("keydown", e => { if (e.key==="Enter") { e.preventDefault(); addChip("hideAdd", S.webview.blocking.hide, render); }});
}

function addChip(inputId, arr, after) {
  const el = $(inputId); if (!el) return;
  const v = el.value.trim(); if (!v) return;
  if (!arr.includes(v)) arr.push(v);
  el.value = "";
  after();
  scheduleSave();
}

function fill() {
  const set = (id, v) => { const el = $(id); if (!el) return; if (el.type==="checkbox") el.checked = !!v; else el.value = v==null?"":v; };
  set("title", S.title);
  set("darkMode", S.window.darkMode || "system");
  set("zoom", String(S.window.zoom || 100));
  set("alwaysOnTop", S.window.alwaysOnTop);
  set("hideOnClose", S.window.hideOnClose);
  set("notifications", S.native.notifications || "allow");
  set("badgeOn", (S.native.badge || "auto") !== "off");
  set("width", S.window.width); set("height", S.window.height);
  set("minWidth", S.window.minWidth); set("minHeight", S.window.minHeight);
  set("mode", S.window.mode || "window");
  set("panelWidth", S.window.panelWidth || 400); set("panelHeight", S.window.panelHeight || 640);
  set("sidebarEdge", S.window.sidebarEdge || "right");
  set("sidebarAutoHide", S.window.sidebarAutoHide);
  set("titleBarStyle", S.window.titleBarStyle || "default");
  set("tabs", S.window.tabs); set("fullscreen", S.window.fullscreen); set("multiWindow", S.window.multiWindow);
  set("externalByDefault", S.webview.externalByDefault ? "1" : "0");
  set("popups", S.webview.navigation.popups || "internal");
  set("userAgentPreset", S.webview.userAgentPreset || "safari");
  set("userAgent", S.webview.userAgent);
  set("restoreLastUrl", S.webview.restoreLastUrl);
  set("findInPage", S.webview.findInPage);
  set("devTools", S.webview.devTools);
  set("internalUrlRegex", S.webview.navigation.internalUrlRegex || "");
  set("downloadDirectory", S.network.downloadDirectory || "");
  set("proxy", S.network.proxy || "");
  set("basicAuthUser", S.network.basicAuthUser || "");
  set("incognito", S.webview.incognito);
  set("trackers", S.webview.blocking.trackers);
  set("cookieBanners", S.webview.blocking.cookieBanners);
  set("tray", S.native.tray); set("startToTray", S.native.startToTray);
  set("globalShortcut", S.native.globalShortcut || "");
  set("linkRouting", S.native.linkRouting);
  set("dragDrop", S.native.dragDrop);
  set("camera", S.native.camera); set("microphone", S.native.microphone);
  set("css", S.webview.css || ""); set("js", S.webview.js || "");
  const d = $("domains"); if (d) chips(d, S.webview.navigation.safeDomains || [], i => { S.webview.navigation.safeDomains.splice(i,1); render(); scheduleSave(); });
  const a = $("allow"); if (a) chips(a, S.webview.blocking.allow || [], i => { S.webview.blocking.allow.splice(i,1); render(); scheduleSave(); });
  const h = $("hide"); if (h) chips(h, S.webview.blocking.hide || [], i => { S.webview.blocking.hide.splice(i,1); render(); scheduleSave(); });
}

function numVal(id, fallback) { const el = $(id); if (!el) return fallback; const n = parseInt(el.value, 10); return Number.isFinite(n) ? n : fallback; }
function chk(id, fallback) { const el = $(id); return el ? el.checked : fallback; }
function val(id, fallback) { const el = $(id); return el ? el.value : fallback; }

function read() {
  if ($("title")) S.title = val("title", S.title);
  if ($("darkMode")) S.window.darkMode = val("darkMode", S.window.darkMode);
  if ($("zoom")) S.window.zoom = numVal("zoom", S.window.zoom);
  if ($("alwaysOnTop")) S.window.alwaysOnTop = chk("alwaysOnTop", S.window.alwaysOnTop);
  if ($("hideOnClose")) S.window.hideOnClose = chk("hideOnClose", S.window.hideOnClose);
  if ($("notifications")) S.native.notifications = val("notifications", S.native.notifications);
  if ($("badgeOn")) S.native.badge = chk("badgeOn", true) ? "auto" : "off";
  if ($("width")) S.window.width = numVal("width", S.window.width);
  if ($("height")) S.window.height = numVal("height", S.window.height);
  if ($("minWidth")) S.window.minWidth = numVal("minWidth", S.window.minWidth);
  if ($("minHeight")) S.window.minHeight = numVal("minHeight", S.window.minHeight);
  if ($("mode")) S.window.mode = val("mode", S.window.mode) === "window" ? "" : val("mode", S.window.mode);
  if ($("panelWidth")) { const n = numVal("panelWidth", 400); S.window.panelWidth = n === 400 ? 0 : n; }
  if ($("panelHeight")) { const n = numVal("panelHeight", 640); S.window.panelHeight = n === 640 ? 0 : n; }
  if ($("sidebarEdge")) S.window.sidebarEdge = val("sidebarEdge", "right") === "right" ? "" : val("sidebarEdge", "");
  if ($("sidebarAutoHide")) S.window.sidebarAutoHide = chk("sidebarAutoHide", false);
  if ($("titleBarStyle")) S.window.titleBarStyle = val("titleBarStyle", "default");
  if ($("tabs")) S.window.tabs = chk("tabs", false);
  if ($("fullscreen")) S.window.fullscreen = chk("fullscreen", false);
  if ($("multiWindow")) S.window.multiWindow = chk("multiWindow", false);
  if ($("externalByDefault")) S.webview.externalByDefault = val("externalByDefault", "1") === "1";
  if ($("popups")) S.webview.navigation.popups = val("popups", "internal");
  if ($("userAgentPreset")) S.webview.userAgentPreset = val("userAgentPreset", "safari");
  if ($("userAgent")) S.webview.userAgent = val("userAgent", "");
  if ($("restoreLastUrl")) S.webview.restoreLastUrl = chk("restoreLastUrl", false);
  if ($("findInPage")) S.webview.findInPage = chk("findInPage", false);
  if ($("devTools")) S.webview.devTools = chk("devTools", false);
  if ($("internalUrlRegex")) S.webview.navigation.internalUrlRegex = val("internalUrlRegex", "");
  if ($("downloadDirectory")) S.network.downloadDirectory = val("downloadDirectory", "");
  if ($("proxy")) S.network.proxy = val("proxy", "");
  if ($("basicAuthUser")) S.network.basicAuthUser = val("basicAuthUser", "");
  if ($("incognito")) S.webview.incognito = chk("incognito", false);
  if ($("trackers")) S.webview.blocking.trackers = chk("trackers", false);
  if ($("cookieBanners")) S.webview.blocking.cookieBanners = chk("cookieBanners", false);
  if ($("tray")) S.native.tray = chk("tray", false);
  if ($("startToTray")) S.native.startToTray = chk("startToTray", false);
  if ($("globalShortcut")) S.native.globalShortcut = val("globalShortcut", "");
  if ($("linkRouting")) S.native.linkRouting = chk("linkRouting", true);
  if ($("dragDrop")) S.native.dragDrop = chk("dragDrop", false);
  if ($("camera")) S.native.camera = chk("camera", false);
  if ($("microphone")) S.native.microphone = chk("microphone", false);
  if ($("css")) S.webview.css = val("css", "");
  if ($("js")) S.webview.js = val("js", "");
}

function collect() {
  read();
  return {
    title: S.title,
    window: S.window,
    webview: {
      userAgent: S.webview.userAgent,
      userAgentPreset: S.webview.userAgentPreset,
      incognito: S.webview.incognito,
      restoreLastUrl: S.webview.restoreLastUrl,
      findInPage: S.webview.findInPage,
      devTools: S.webview.devTools,
      navigation: S.webview.navigation,
      css: S.webview.css,
      js: S.webview.js,
      blocking: S.webview.blocking,
      externalByDefault: S.webview.externalByDefault
    },
    network: S.network,
    native: S.native
  };
}

function scheduleSave() {
  clearTimeout(saveT);
  saveT = setTimeout(() => say("mypack:settings:save"), 450);
}

window.MP = {
  collect,
  error(msg) { const e = $("error"); e.textContent = msg; e.classList.remove("hidden"); },
  setDownloadDir(p) { S.network.downloadDirectory = p; const el = $("downloadDirectory"); if (el) el.value = p; scheduleSave(); }
};

render();
</script>
</body></html>
